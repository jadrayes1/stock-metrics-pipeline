# Pre-fetches relevant news articles for the app's ticker universe,
# published to the SAME public Gist as marketMetrics.json (see
# generate-sector-metrics.yml) as a second file, newsCache.json — see
# scripts/generateNewsCache.js for the full rationale and design (why this
# is a separate workflow rather than a step bolted onto the main one, the
# time-budget-per-run + least-recently-cached-first rotation, etc.).
#
# Scheduled several hours after the main sector-metrics job (which starts
# ~08:00 UTC and takes ~4.5-4.8hrs) so the two jobs don't compete for
# Finnhub's account-wide rate limit at the same time.
#
# Uses the SAME repository secrets as generate-sector-metrics.yml
# (FINNHUB_API_KEY, GIST_ID, GIST_TOKEN) — no additional one-time setup
# needed if that workflow is already configured.

name: Generate news cache

on:
  schedule:
    - cron: '0 16 * * *' # ~11:00 US Eastern — well after the sector-metrics job finishes
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Shares a concurrency group with every other gist-publisher in this repo
# (generate-sector-metrics.yml/apply-dcf-cap.yml/generate-pfcf-trend-cache.yml)
# -- see generate-sector-metrics.yml's own comment for the full root-cause
# history of why a bare `gh gist edit` (this workflow's publish step, until
# now) could silently revert a fresher publish from any other writer,
# including one in a different repository -- the git-clone + force-with-lease
# + retry pattern below is the actual cross-repo-safe mechanism; this group
# is just an optimization against same-repo contention.
concurrency:
  group: gist-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate news cache
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/generateNewsCache.js

      - name: Publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          CLONE_URL="https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git"
          attempt=1
          while true; do
            rm -rf gist-clone
            git clone --depth 1 "$CLONE_URL" gist-clone
            if diff -q newsCache.json gist-clone/newsCache.json >/dev/null 2>&1; then
              echo "No changes to publish."
              break
            fi
            EXPECTED_SHA=$(git -C gist-clone rev-parse HEAD)
            cp newsCache.json gist-clone/newsCache.json
            ( cd gist-clone
              git config user.email "actions@github.com"
              git config user.name "stock-metrics-pipeline"
              git checkout --orphan latest-snapshot
              git add -A
              git commit -m "Update news cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git branch -M main
              git push --force-with-lease="main:${EXPECTED_SHA}" origin main
            ) && { echo "Published on attempt $attempt."; break; }
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::Publish rejected 5 times in a row -- the gist kept changing underneath this run. Not forcing; re-dispatch once things settle."
              exit 1
            fi
            echo "Push rejected (remote moved since clone) — retrying (attempt ${attempt}/5)..."
          done

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'news-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'News-cache pipeline failed',
                body: `The news-cache generation run failed.\n\nRun: ${runUrl}\n\nCheck the FINNHUB_API_KEY, GIST_TOKEN, and GIST_ID secrets, and Finnhub's API status. Note: this is separate from the main sector-metrics pipeline — that one is unaffected.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'news-pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'News-cache pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
