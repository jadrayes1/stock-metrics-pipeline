# Pre-fetches relevant news articles for the app's ticker universe,
# published to the SAME public Gist as marketMetrics.json (see
# generate-sector-metrics.yml) as a second file, newsCache.json — see
# scripts/generateNewsCache.js for the full rationale and design (why this
# is a separate workflow rather than a step bolted onto the main one, the
# time-budget-per-run + least-recently-cached-first rotation, etc.).
#
# Scheduled several hours after the main sector-metrics job (which starts
# ~08:00 UTC and takes ~4.5-4.8hrs) so the two jobs don't compete for
# Finnhub's account-wide rate limit at the same time.
#
# Uses the SAME repository secrets as generate-sector-metrics.yml
# (FINNHUB_API_KEY, GIST_ID, GIST_TOKEN) — no additional one-time setup
# needed if that workflow is already configured.

name: Generate news cache

on:
  schedule:
    - cron: '0 16 * * *' # ~11:00 US Eastern — well after the sector-metrics job finishes
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate news cache
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/generateNewsCache.js

      - name: Publish to gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          gh gist edit "${{ secrets.GIST_ID }}" --filename newsCache.json newsCache.json || \
          gh gist edit "${{ secrets.GIST_ID }}" --add newsCache.json

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'news-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'News-cache pipeline failed',
                body: `The news-cache generation run failed.\n\nRun: ${runUrl}\n\nCheck the FINNHUB_API_KEY, GIST_TOKEN, and GIST_ID secrets, and Finnhub's API status. Note: this is separate from the main sector-metrics pipeline — that one is unaffected.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'news-pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'News-cache pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
