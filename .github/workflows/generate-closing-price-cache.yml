# Fetches Finnhub's /quote for every ticker in the pipeline's covered
# universe and publishes closingPriceCache.json to the SAME public Gist as
# marketMetrics.json — see scripts/generateClosingPriceCache.js for the
# full rationale (lets the app show a ticker's price from this cached run
# instead of a live per-device Finnhub call, which doesn't scale past a
# handful of concurrent users on the app's one shared free-tier key).
#
# Deliberately its OWN workflow, not folded into generate-sector-metrics.yml —
# that job already makes 4 Finnhub calls/ticker and has a documented history
# of bumping against GitHub Actions' 6-hour ceiling; adding a 5th call there
# risked pushing it over. This job is a single call per ticker, so it runs
# in well under an hour even on one key.
#
# Scheduled after US market close (4:00pm ET). 21:15 UTC comfortably covers
# both EDT (4pm ET = 20:00 UTC) and EST (4pm ET = 21:00 UTC) with a 15min
# settlement buffer either way — re-tune if that margin ever feels tight.
# Runs independently of generate-sector-metrics.yml's own 00:00 UTC start,
# reusing that job's already-published marketMetrics.json for its own
# ticker list rather than a separate universe fetch.
#
# No new secrets needed beyond what generate-sector-metrics.yml already has
# configured (FINNHUB_API_KEY, optionally FINNHUB_API_KEY_2, GIST_ID,
# GIST_TOKEN) — all reused here.

name: Generate closing price cache

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Optional: restrict this run to one ticker (debugging).'
        required: false
        type: string

permissions:
  contents: read
  issues: write

# Shares a concurrency group with every other gist-publisher in this repo --
# see generate-sector-metrics.yml's own comment for the full root-cause
# history of why a bare `gh gist edit` (this workflow's publish step, until
# now) could silently revert a fresher publish from any other writer,
# including one in a different repository -- the git-clone + force-with-lease
# + retry pattern below is the actual cross-repo-safe mechanism; this group
# is just an optimization against same-repo contention.
concurrency:
  group: gist-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate closing price cache
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_API_KEY_2: ${{ secrets.FINNHUB_API_KEY_2 }}
          TARGET_SYMBOL: ${{ inputs.symbol }}
        run: node scripts/generateClosingPriceCache.js

      - name: Publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          CLONE_URL="https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git"
          attempt=1
          while true; do
            rm -rf gist-clone
            git clone --depth 1 "$CLONE_URL" gist-clone
            if diff -q closingPriceCache.json gist-clone/closingPriceCache.json >/dev/null 2>&1; then
              echo "No changes to publish."
              break
            fi
            EXPECTED_SHA=$(git -C gist-clone rev-parse HEAD)
            cp closingPriceCache.json gist-clone/closingPriceCache.json
            ( cd gist-clone
              git config user.email "actions@github.com"
              git config user.name "stock-metrics-pipeline"
              git checkout --orphan latest-snapshot
              git add -A
              git commit -m "Update closing price cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git branch -M main
              git push --force-with-lease="main:${EXPECTED_SHA}" origin main
            ) && { echo "Published on attempt $attempt."; break; }
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::Publish rejected 5 times in a row -- the gist kept changing underneath this run. Not forcing; re-dispatch once things settle."
              exit 1
            fi
            echo "Push rejected (remote moved since clone) — retrying (attempt ${attempt}/5)..."
          done

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'closing-price-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Closing price cache pipeline failed',
                body: `The closing price cache generation run failed.\n\nRun: ${runUrl}\n\nCheck the FINNHUB_API_KEY, GIST_TOKEN, and GIST_ID secrets, and Finnhub's API status. Note: this is separate from the main sector-metrics pipeline — that is unaffected.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'closing-price-pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Resolved — the pipeline succeeded on a subsequent run.',
              });
            }
