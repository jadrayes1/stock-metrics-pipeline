# Fetches Finnhub's /quote for every ticker in the pipeline's covered
# universe and publishes closingPriceCache.json to the SAME public Gist as
# marketMetrics.json — see scripts/generateClosingPriceCache.js for the
# full rationale (lets the app show a ticker's price from this cached run
# instead of a live per-device Finnhub call, which doesn't scale past a
# handful of concurrent users on the app's one shared free-tier key).
#
# Deliberately its OWN workflow, not folded into generate-sector-metrics.yml —
# that job already makes 4 Finnhub calls/ticker and has a documented history
# of bumping against GitHub Actions' 6-hour ceiling; adding a 5th call there
# risked pushing it over. This job is a single call per ticker, so it runs
# in well under an hour even on one key.
#
# Scheduled after US market close (4:00pm ET). 21:15 UTC comfortably covers
# both EDT (4pm ET = 20:00 UTC) and EST (4pm ET = 21:00 UTC) with a 15min
# settlement buffer either way — re-tune if that margin ever feels tight.
# Runs independently of generate-sector-metrics.yml's own 00:00 UTC start,
# reusing that job's already-published marketMetrics.json for its own
# ticker list rather than a separate universe fetch.
#
# No new secrets needed beyond what generate-sector-metrics.yml already has
# configured (FINNHUB_API_KEY, optionally FINNHUB_API_KEY_2, GIST_ID,
# GIST_TOKEN) — all reused here.

name: Generate closing price cache

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Optional: restrict this run to one ticker (debugging).'
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate closing price cache
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_API_KEY_2: ${{ secrets.FINNHUB_API_KEY_2 }}
          TARGET_SYMBOL: ${{ inputs.symbol }}
        run: node scripts/generateClosingPriceCache.js

      - name: Publish to gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          gh gist edit "${{ secrets.GIST_ID }}" --filename closingPriceCache.json closingPriceCache.json || \
          gh gist edit "${{ secrets.GIST_ID }}" --add closingPriceCache.json

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'closing-price-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Closing price cache pipeline failed',
                body: `The closing price cache generation run failed.\n\nRun: ${runUrl}\n\nCheck the FINNHUB_API_KEY, GIST_TOKEN, and GIST_ID secrets, and Finnhub's API status. Note: this is separate from the main sector-metrics pipeline — that is unaffected.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'closing-price-pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Resolved — the pipeline succeeded on a subsequent run.',
              });
            }
