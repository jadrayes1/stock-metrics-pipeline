# Daily fetch of industry classification + fundamentals for every
# NASDAQ/NYSE/NYSE American common stock and REIT (~5,145 tickers), published
# to a public Gist that the stock-analyzer app reads at runtime — see that
# app's src/api/sectorComparison.js. Published as SIX separate files, not
# one: marketMetrics.json (small — card values + industry leaders, fetched
# on every screen) plus trendsNative.json/trendsQuarterly.json/
# trendsYearly.json/trendsTtm.json (large — tens of MB combined at
# full-universe scale, fetched by the app only when a trend chart actually
# needs that specific cadence) plus coverageAudit.json. See
# scripts/generateSectorMetrics.js's OUTPUT_TRENDS_*_FILE comments for why
# the trend caches aren't just embedded in marketMetrics.json.
#
# Also runs scripts/auditMetricsCoverage.js right after — a fast, read-only
# scan (no new API calls) of how many tickers are missing each of the 6
# comparable metrics, and why, published to the same Gist as coverageAudit.json
# for tracking coverage over time.
#
# This lives in its OWN public repo, separate from the app's (private) repo,
# for two reasons:
#   1. A Gist's visibility doesn't depend on the repo that updates it, so
#      the app's source can stay private while this feed stays public.
#   2. This job takes ~6.5-7.5 hours on a single Finnhub key (four calls per
#      ticker — the third is for the estimated-fair-value DCF, the fourth
#      is quarterly financials-reported, now fetched for every ticker
#      rather than just ones with a native-data gap, so every metric's
#      Quarterly/Yearly/TTM trend chart can load from a precomputed cache
#      instead of live-reconstructing on first tap — rate-limited to stay
#      under the free-tier 60/min cap PER KEY). If a second repository
#      secret, FINNHUB_API_KEY_2, is set (a second, independent free
#      Finnhub account), the script splits the ticker universe across one
#      worker per key running concurrently, each pacing its own calls
#      against its own key's 60/min budget — this roughly halves the
#      runtime to ~3.25-3.75hrs. Optional: the job runs fine on one key,
#      just slower. Public repos get unlimited free GitHub Actions minutes
#      on standard runners; private repos only get a limited monthly
#      allowance, which a daily multi-hour job would blow through fast.
#
# Failure monitoring: on failure, opens (or comments on, if one's already
# open) a `pipeline-failure`-labeled issue in this repo — auto-closed the
# next time the job succeeds. GitHub can also email on scheduled-workflow
# failure, but that requires Actions notifications to be enabled under
# github.com/settings/notifications and is easy to miss as a one-off email;
# an open issue is a persistent, visible signal either way. Note neither of
# these catches the job never running at all (e.g. GitHub auto-disables
# schedules after 60 days with zero repo activity, though the daily commit
# from this workflow itself should prevent that) — an external heartbeat
# service (e.g. healthchecks.io) would be needed to catch that specific case.
#
# One-time setup required (this workflow can't do these for you):
#   1. Add a repository secret named FINNHUB_API_KEY with your Finnhub key.
#   2. Optional: add a repository secret named FINNHUB_API_KEY_2 with a
#      SECOND, independent Finnhub account's key, to roughly halve the
#      runtime (see point 2 above). Leave it unset to run on one key.
#   3. Add a repository secret named GIST_ID (the target Gist's ID).
#   4. Add a repository secret named GIST_TOKEN — a Personal Access Token
#      scoped to ONLY "gist", CLASSIC type (not fine-grained — fine-grained
#      tokens' Gists permission can end up read-only, which fails silently
#      as an HTTP 404 on the write, not a clear permission error).

name: Generate sector metrics

on:
  schedule:
    # 00:00 UTC (~8pm US Eastern the prior night). Moved earlier from 02:00
    # UTC (which itself was moved from 08:00 — see git history) after adding
    # full Quarterly/Yearly/TTM trend caching pushed runtime from ~5.5hrs to
    # an estimated ~6.5-7.5hrs (quarterly financials-reported is now fetched
    # for every ticker, not just gap ones). Combined with GitHub's observed
    # 2h36m-3h24m scheduled-run start delay on this public repo, the old
    # 02:00 UTC start risked landing at or after 9am ET market open in a
    # worst case instead of comfortably before it. This start time is a
    # proactive estimate, not yet measured against a real run at the new
    # runtime — re-tune if the actual finish time cuts it closer than
    # expected once real data comes in.
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dataset
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_API_KEY_2: ${{ secrets.FINNHUB_API_KEY_2 }}
        run: node scripts/generateSectorMetrics.js

      - name: Audit metric coverage
        run: node scripts/auditMetricsCoverage.js

      # Git-based push, not `gh gist edit` (which goes through the Gist API
      # and rejects any file over 1MB) — the trend cache files run into the
      # tens of megabytes at full-universe scale, well past that API limit
      # but comfortably under git's own file-size guidance. Gists are just
      # git repos under the hood, so cloning, committing, and pushing works
      # the same as any other repo.
      - name: Publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          git clone "https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git" gist-clone
          cp src/data/marketMetrics.json gist-clone/marketMetrics.json
          cp src/data/trendsNative.json gist-clone/trendsNative.json
          cp src/data/trendsQuarterly.json gist-clone/trendsQuarterly.json
          cp src/data/trendsYearly.json gist-clone/trendsYearly.json
          cp src/data/trendsTtm.json gist-clone/trendsTtm.json
          cp coverageAudit.json gist-clone/coverageAudit.json
          cd gist-clone
          git config user.email "actions@github.com"
          git config user.name "stock-metrics-pipeline"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update dataset $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Sector-metrics pipeline failed',
                body: `The daily generation run failed.\n\nRun: ${runUrl}\n\nCheck the FINNHUB_API_KEY, GIST_TOKEN, and GIST_ID secrets, and Finnhub's API status.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
