# Daily fetch of industry classification + fundamentals for every
# NASDAQ/NYSE/NYSE American common stock and REIT (~5,145 tickers), published
# to a public Gist that the stock-analyzer app reads at runtime — see that
# app's src/api/sectorComparison.js. Published as SIX separate files, not
# one: marketMetrics.json (small — card values + industry leaders, fetched
# on every screen) plus trendsNative.json/trendsQuarterly.json/
# trendsYearly.json/trendsTtm.json (large — tens of MB combined at
# full-universe scale, fetched by the app only when a trend chart actually
# needs that specific cadence) plus coverageAudit.json. See
# scripts/generateSectorMetrics.js's OUTPUT_TRENDS_*_FILE comments for why
# the trend caches aren't just embedded in marketMetrics.json.
#
# Also runs scripts/auditMetricsCoverage.js right after — a fast, read-only
# scan (no new API calls) of how many tickers are missing each of the 6
# comparable metrics, and why, published to the same Gist as coverageAudit.json
# for tracking coverage over time.
#
# Between those two, applies real analyst-consensus price targets to two
# distinct subsets of tickers (see DCF_CAP_CANDIDATE_MULTIPLE in
# generateSectorMetrics.js, scripts/fetchDcfCapTargets.py, and
# scripts/applyDcfCap.js): caps an outlier estimatedFairValue at the
# analyst high, for tickers whose DCF estimate came out unusually far above
# the current price; and fills estimatedFairValue with the analyst
# mid-range for tickers where DCF wasn't computable at all (tagged
# estimatedFairValueSource: 'analystConsensus' so it stays distinguishable
# from a real DCF output). This uses yfinance (Yahoo Finance) since analyst
# price targets aren't available on Finnhub's free tier. Both
# yfinance-touching steps have `continue-on-error: true` since that's an
# undocumented, unofficial endpoint with no rate-limit guarantee — a
# failure there never blocks the rest of the pipeline from publishing;
# affected tickers just keep whatever estimatedFairValue they already had
# for that run.
#
# This lives in its OWN public repo, separate from the app's (private) repo,
# for two reasons:
#   1. A Gist's visibility doesn't depend on the repo that updates it, so
#      the app's source can stay private while this feed stays public.
#   2. This job's pure API-pacing time is ~7.7hrs on a single Finnhub key
#      (four calls per ticker — the third is for the estimated-fair-value
#      DCF, the fourth is quarterly financials-reported, now fetched for
#      every ticker rather than just ones with a native-data gap, so every
#      metric's Quarterly/Yearly/TTM trend chart can load from a
#      precomputed cache instead of live-reconstructing on first tap — see
#      REQUEST_SPACING_MS in generateSectorMetrics.js for the pacing/cap
#      math). If a second repository secret, FINNHUB_API_KEY_2, is set (a
#      second, independent free Finnhub account), the script splits the
#      ticker universe across one worker per key running concurrently, each
#      pacing its own calls against its own key's budget — this roughly
#      halves the pure-pacing time to ~3.9hrs. Optional: the job runs fine
#      on one key, just slower.
#
#      IMPORTANT — pure pacing is not the whole story: real 2-key runs have
#      consistently taken 4.7-4.9hrs even when nothing 429s, and multiple
#      runs have exceeded GitHub's hard 6-hour per-job ceiling for hosted
#      runners (confirmed live 2026-08-25 — this is a platform limit, NOT
#      this job's own `timeout-minutes: 600` below, which is longer and
#      irrelevant here) after a 429-driven retry/backoff cascade (see
#      fetchFinnhub's own comment) added another 60-90+ min on top. The
#      ~3.25-3.75hr figure that used to be documented here was a pure-pacing
#      estimate that was never actually observed in a real run — treat any
#      estimate in this comment with real live runs, not just arithmetic,
#      until it's re-verified after the REQUEST_SPACING_MS widening above.
#      Public repos get unlimited free GitHub Actions minutes
#      on standard runners; private repos only get a limited monthly
#      allowance, which a daily multi-hour job would blow through fast.
#
# Failure monitoring: on failure, opens (or comments on, if one's already
# open) a `pipeline-failure`-labeled issue in this repo — auto-closed the
# next time the job succeeds. GitHub can also email on scheduled-workflow
# failure, but that requires Actions notifications to be enabled under
# github.com/settings/notifications and is easy to miss as a one-off email;
# an open issue is a persistent, visible signal either way. Note neither of
# these catches the job never running at all (e.g. GitHub auto-disables
# schedules after 60 days with zero repo activity, though the daily commit
# from this workflow itself should prevent that) — an external heartbeat
# service (e.g. healthchecks.io) would be needed to catch that specific case.
#
# One-time setup required (this workflow can't do these for you):
#   1. Add a repository secret named FINNHUB_API_KEY with your Finnhub key.
#   2. Optional: add a repository secret named FINNHUB_API_KEY_2 with a
#      SECOND, independent Finnhub account's key, to roughly halve the
#      runtime (see point 2 above). Leave it unset to run on one key.
#   3. Add a repository secret named GIST_ID (the target Gist's ID).
#   4. Add a repository secret named GIST_TOKEN — a Personal Access Token
#      scoped to ONLY "gist", CLASSIC type (not fine-grained — fine-grained
#      tokens' Gists permission can end up read-only, which fails silently
#      as an HTTP 404 on the write, not a clear permission error).

name: Generate sector metrics

on:
  schedule:
    # 00:00 UTC (~8pm US Eastern the prior night). Moved earlier from 02:00
    # UTC (which itself was moved from 08:00 — see git history) after adding
    # full Quarterly/Yearly/TTM trend caching pushed runtime up (quarterly
    # financials-reported is now fetched for every ticker, not just gap
    # ones). Real 2-key runs land in the 4.7-4.9hr range on a clean run, up
    # to GitHub's hard 6-hour per-job ceiling on a bad one (see the runtime
    # note near the top of this file) — even the worst case (00:00 UTC +
    # GitHub's observed 2h36m-3h24m scheduled-run start delay + a full 6hr
    # run) still lands around 09:24 UTC / ~5:24am ET, comfortably before
    # 9:30am ET market open. Re-tune this start time if that margin ever
    # tightens (a 3rd Finnhub key, or splitting this into two scheduled
    # workflows, are the next levers if the 6-hour ceiling keeps getting hit
    # after REQUEST_SPACING_MS's 2026-08-25 widening).
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dataset
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FINNHUB_API_KEY_2: ${{ secrets.FINNHUB_API_KEY_2 }}
        run: node scripts/generateSectorMetrics.js

      # DCF cap + fallback (real analyst price targets via yfinance,
      # capping outlier estimates or filling gaps where DCF wasn't
      # computable) used to run right here, but was pulled out into its own
      # separate workflow (see apply-dcf-cap.yml) on 2026-08-26 — verified
      # live that step alone was taking ~72 minutes (4,154 of ~5,161
      # tickers needed a lookup) with no time budget, a direct contributor
      # to this job repeatedly hitting GitHub Actions' hard 6-hour ceiling.
      # Splitting it out also means EVERY candidate gets checked on every
      # run of that workflow, rather than a bounded/rotating subset each
      # day the way a budget-capped version bolted on here would have
      # required. This job now only needs to publish dcfCapCandidates.json
      # (below) so that workflow knows which tickers to look up.

      - name: Audit metric coverage
        run: node scripts/auditMetricsCoverage.js

      # Git-based push, not `gh gist edit` (which goes through the Gist API
      # and rejects any file over 1MB) — the trend cache files run into the
      # tens of megabytes at full-universe scale, well past that API limit
      # but comfortably under git's own file-size guidance. Gists are just
      # git repos under the hood, so cloning, committing, and pushing works
      # the same as any other repo.
      #
      # Orphan commit each run instead of accumulating full git history —
      # verified live: committing a fresh multi-ten-MB snapshot on top of
      # the previous day's history, every day, with nothing ever squashed,
      # eventually pushed this gist's repo past GitHub's own (undocumented)
      # size quota ("Repository is above its size quota" pre-receive
      # rejection, confirmed live 2026-08-19). The gist is only ever read
      # for its LATEST content by every consumer — nothing depends on its
      # git history — so resetting to a single fresh commit each run loses
      # nothing and keeps the repo permanently small. The "no changes"
      # short-circuit now diffs the source files against the freshly-cloned
      # ones directly (rather than via `git diff --cached`, which would
      # always show everything as new against an orphan branch's empty
      # history) so an unchanged day still skips the force-push.
      - name: Publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          git clone --depth 1 "https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git" gist-clone
          if diff -q src/data/marketMetrics.json gist-clone/marketMetrics.json >/dev/null 2>&1 && \
             diff -q src/data/trendsNative.json gist-clone/trendsNative.json >/dev/null 2>&1 && \
             diff -q src/data/trendsQuarterly.json gist-clone/trendsQuarterly.json >/dev/null 2>&1 && \
             diff -q src/data/trendsYearly.json gist-clone/trendsYearly.json >/dev/null 2>&1 && \
             diff -q src/data/trendsTtm.json gist-clone/trendsTtm.json >/dev/null 2>&1 && \
             diff -q coverageAudit.json gist-clone/coverageAudit.json >/dev/null 2>&1 && \
             diff -q dcfCapCandidates.json gist-clone/dcfCapCandidates.json >/dev/null 2>&1; then
            echo "No changes to publish."
          else
            cp src/data/marketMetrics.json gist-clone/marketMetrics.json
            cp src/data/trendsNative.json gist-clone/trendsNative.json
            cp src/data/trendsQuarterly.json gist-clone/trendsQuarterly.json
            cp src/data/trendsYearly.json gist-clone/trendsYearly.json
            cp src/data/trendsTtm.json gist-clone/trendsTtm.json
            cp coverageAudit.json gist-clone/coverageAudit.json
            # dcfCapCandidates.json is small (well under the Gist API's 1MB
            # cap) but published via this same git-clone step, not a
            # separate `gh gist edit` call, purely so it lands in the SAME
            # commit/snapshot as marketMetrics.json — apply-dcf-cap.yml
            # reads both together and they need to describe the same run.
            cp dcfCapCandidates.json gist-clone/dcfCapCandidates.json
            cd gist-clone
            git config user.email "actions@github.com"
            git config user.name "stock-metrics-pipeline"
            git checkout --orphan latest-snapshot
            git add -A
            git commit -m "Update dataset $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git branch -M main
            git push --force origin main
          fi

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Sector-metrics pipeline failed',
                body: `The daily generation run failed.\n\nRun: ${runUrl}\n\nCheck the FINNHUB_API_KEY, GIST_TOKEN, and GIST_ID secrets, and Finnhub's API status.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
