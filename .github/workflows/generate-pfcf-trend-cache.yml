# Pre-fetches a P/FCF TREND (not just the latest value) for tickers whose
# Finnhub quarterly pfcfTTM series is empty, published to the SAME public
# Gist as marketMetrics.json (see generate-sector-metrics.yml) as a third
# file, pfcfTrendCache.json — see scripts/generatePfcfTrendCache.js for the
# full rationale and design (why this needs its own workflow, the Twelve
# Data call budget + least-recently-attempted rotation, etc.).
#
# Scheduled between the other jobs so none of them compete for Finnhub's
# account-wide rate limit at the same time:
#   - generate-sector-metrics.yml: 00:00 UTC, ~6.5-7.5hr runtime (worst-case
#     finish ~11:00 UTC with GitHub's observed scheduling delay — moved
#     earlier and this job's start pushed later, from 09:00, after adding
#     full Quarterly/Yearly/TTM trend caching there grew its runtime)
#   - generate-pfcf-trend-cache.yml (this one): 12:00 UTC
#   - generate-foreign-filings-cache.yml (separate repo): 14:00 UTC
#   - generate-news-cache.yml: 16:00 UTC
#
# One-time setup required BEYOND generate-sector-metrics.yml's existing
# secrets (FINNHUB_API_KEY, GIST_ID, GIST_TOKEN — reused here, no changes
# needed to those):
#   1. Sign up for a SECOND, separate free Twelve Data account (Twelve Data
#      allows this at no cost) — deliberately not the same key
#      stock-analyzer-proxy uses for the app's own live per-device P/FCF
#      fallback, so this batch job's usage doesn't compete with live user
#      traffic for the same 800-calls/day free-tier budget.
#   2. Add a repository secret named TWELVEDATA_PIPELINE_API_KEY with that
#      second account's API key.
#   3. Optional: add a repository secret named TWELVEDATA_PIPELINE_API_KEY_2
#      with a THIRD, independent Twelve Data account's key — runs one
#      worker per key in parallel (see runWorker/main() in
#      scripts/generatePfcfTrendCache.js), roughly doubling the effective
#      daily rotation throughput since each account has its own separate
#      800/day cap. Leave unset to run on one key, same as before.

name: Generate P/FCF trend cache

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Optional: process only this one ticker (debugging), ignoring the normal gap list/rotation'
        required: false
        type: string
      recomputeMetrics:
        description: 'Optional: pfcfRatio and/or peRatio (comma-separated) -- lets this run overwrite already-published points for those metrics (RECOMPUTE_METRICS). Needed after a deliberate calculation change. Leave blank for normal runs.'
        required: false
        type: string

permissions:
  contents: read
  issues: write

# Shares a concurrency group with generate-sector-metrics.yml/apply-dcf-cap.yml
# -- see generate-sector-metrics.yml's own comment for the full root-cause
# history. This workflow's own publish step below was, until now, still a
# bare `gh gist edit` call with no compare-and-swap protection at all --
# verified live 2026-09-18 as a REAL, ongoing contributor to marketMetrics.json
# staying frozen for a month even AFTER the git-clone/force-with-lease fix
# landed elsewhere: a successful, verified git push from generate-sector-
# metrics.yml (new commit confirmed via the GitHub API) was found completely
# absent from the gist's revision history minutes later, with this
# workflow's own unprotected publish the only other writer active in that
# window. `gh gist edit`'s REST-API read-modify-write has no way to detect
# or reject a stale base the way git's own force-with-lease does, so it can
# silently republish an old full snapshot over a fresher one from ANY other
# writer -- including ones in a completely different repository, which a
# same-repo concurrency group alone can never protect against. Converted
# below to the same git-clone + force-with-lease + retry pattern as the
# other two -- that's the actual cross-repo-safe mechanism; the concurrency
# group here is just an optimization against same-repo contention.
concurrency:
  group: gist-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A scheduled recompute sweep, without adding runs: the repo variable
      # SWEEP_PLAN maps a workflow name to {metrics, from, until} (ISO UTC),
      # and only a SCHEDULED run that starts inside that window recomputes.
      # Manual dispatches use their own recomputeMetrics input only -- a
      # targeted recompute can retract points, which a sweep must never do.
      # Expires on its own at `until`; clear SWEEP_PLAN afterwards. SWEEP_SINCE
      # (= from) lets the rotating P/FCF scripts recompute each ticker once.
      - name: Resolve recompute sweep
        env:
          INPUT_RECOMPUTE: ${{ inputs.recomputeMetrics }}
          SWEEP_PLAN: ${{ vars.SWEEP_PLAN }}
        run: |
          node -e "
          const input = (process.env.INPUT_RECOMPUTE || '').trim();
          let out = input, why = 'manual input', since = '';
          if (!out && process.env.GITHUB_EVENT_NAME === 'schedule') {
            let plan = {};
            try { plan = JSON.parse(process.env.SWEEP_PLAN || '{}'); } catch (e) { console.log('::warning::SWEEP_PLAN is not valid JSON -- no sweep this run'); }
            const p = plan[process.env.GITHUB_WORKFLOW], now = Date.now();
            if (p && now >= Date.parse(p.from) && now < Date.parse(p.until)) { out = p.metrics; since = p.from; why = 'scheduled sweep ' + p.from + ' to ' + p.until; }
          }
          if (out) console.log('::notice::RECOMPUTE_METRICS=' + out + ' (' + why + ')');
          require('fs').appendFileSync(process.env.GITHUB_ENV, 'RESOLVED_RECOMPUTE_METRICS=' + out + '\nSWEEP_SINCE=' + since + '\n');
          "

      - name: Generate P/FCF trend cache
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TWELVEDATA_PIPELINE_API_KEY: ${{ secrets.TWELVEDATA_PIPELINE_API_KEY }}
          TWELVEDATA_PIPELINE_API_KEY_2: ${{ secrets.TWELVEDATA_PIPELINE_API_KEY_2 }}
          TARGET_SYMBOL: ${{ inputs.symbol }}
          RECOMPUTE_METRICS: ${{ env.RESOLVED_RECOMPUTE_METRICS }}
          DEBUG_PFCF_SYMBOLS: ${{ inputs.symbol }}
        run: node scripts/generatePfcfTrendCache.js

      - name: Publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          # Fallback credentials for when GitHub REDIRECTS the gist push.
          # git drops credentials embedded in a URL when it follows a redirect,
          # then tries to prompt for a username -- and with no terminal it dies
          # with "could not read Username for 'https://gist.github.com'".
          # Verified live 2026-10-19/20: the sector-metrics publish, foreign
          # shard 3/3 and two trending-social runs all failed this way, each
          # log showing "warning: redirecting to https://gist.github.com/***.git/"
          # immediately before the auth error. Intermittent because the
          # redirect only sometimes happens. The helper is consulted ONLY when
          # git would otherwise prompt, so the normal no-redirect path is
          # untouched. The retry loop below then reported "remote moved since
          # clone", which was never the cause.
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=${GIST_TOKEN}"; }; f'
          CLONE_URL="https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git"
          attempt=1
          while true; do
            rm -rf gist-clone
            git clone --depth 1 "$CLONE_URL" gist-clone
            if diff -q pfcfTrendCache.json gist-clone/pfcfTrendCache.json >/dev/null 2>&1; then
              echo "No changes to publish."
              break
            fi
            EXPECTED_SHA=$(git -C gist-clone rev-parse HEAD)
            cp pfcfTrendCache.json gist-clone/pfcfTrendCache.json
            ( cd gist-clone
              git config user.email "actions@github.com"
              git config user.name "stock-metrics-pipeline"
              git checkout --orphan latest-snapshot
              git add -A
              git commit -m "Update P/FCF trend cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git branch -M main
              git push --force-with-lease="main:${EXPECTED_SHA}" origin main
            ) && { echo "Published on attempt $attempt."; break; }
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::Publish failed 5 times in a row. The cause is in the git error printed before each retry: 'stale info' or 'rejected' means another run updated the gist first; 'could not read Username' means authentication failed. Not forcing."
              exit 1
            fi
            echo "Push failed -- see the git error just above for why. Retrying (attempt ${attempt}/5)..."
          done

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pfcf-trend-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'P/FCF trend cache pipeline failed',
                body: `The P/FCF trend cache generation run failed.\n\nRun: ${runUrl}\n\nCheck the FINNHUB_API_KEY, TWELVEDATA_PIPELINE_API_KEY, GIST_TOKEN, and GIST_ID secrets, and Finnhub's/Twelve Data's API status. Note: this is separate from the main sector-metrics pipeline and the news-cache pipeline — those are unaffected.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pfcf-trend-pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'P/FCF trend cache pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
