# Applies the DCF cap/fallback treatment (real analyst price targets via
# yfinance) that used to run as steps inside generate-sector-metrics.yml,
# split out into its own workflow on 2026-08-26 — see that workflow's own
# comment for why: the yfinance lookup alone was taking ~72 minutes with no
# time budget (4,154 of ~5,161 tickers needed one), a direct contributor to
# that job repeatedly hitting GitHub Actions' hard 6-hour ceiling.
#
# Splitting this out has a real correctness benefit beyond just timing: a
# budget-capped version bolted onto the main job would only get through a
# rotating SUBSET of candidates each day (whichever the random shuffle
# picked before the budget ran out), leaving the rest stuck with whatever
# they had until a later day's turn. Running standalone with a generous
# budget (see TIME_BUDGET_SECONDS in fetchDcfCapTargets.py — 3 hours,
# comfortably covers the current ~4,150-candidate volume with room to grow)
# means EVERY candidate gets a fresh check on EVERY run instead.
#
# Reads dcfCapCandidates.json and marketMetrics.json from the gist (both
# published by generate-sector-metrics.js's own run earlier the same day —
# see that workflow's "Publish to gist" step), applies the cap/fallback,
# and republishes the updated marketMetrics.json — same git-clone,
# preserve-everything-else-untouched approach as the main workflow.
#
# Triggered by generate-sector-metrics.yml's own completion (workflow_run
# below) instead of an independent cron guess — verified live this matters:
# a cron aimed at "comfortably after the main pipeline's worst realistic
# runtime" doesn't account for GitHub's own scheduling delay on the
# TRIGGER itself, which observed live pushed this workflow's actual start
# 10-14 hours later than its nominal 10:00 UTC (21:08 UTC, 20:14 UTC,
# 23:33 UTC on three consecutive days). Since estimatedFairValue is
# deliberately NOT merge-protected across runs (see generateSectorMetrics.js's
# pickMetricValue comment — a fresh null there is usually the sanity guard
# correctly rejecting a bad DCF, not a data gap to paper over), every one
# of generate-sector-metrics.yml's daily runs wipes the previous day's
# cap/fallback fixes back to raw values, and this workflow is the only
# thing that restores them — so that 10-14hr cron-relative delay was a
# real multi-hour daily window where ~70% of tickers showed no DCF
# estimate at all and outliers (verified live: SKYW at ~6x its real price)
# stayed uncapped. A workflow_run trigger fires as soon as the upstream
# run's OWN completion webhook lands, cutting that window down to just
# this workflow's own ~1.5hr runtime. Gated on the upstream run actually
# succeeding (see the job-level `if` below) — never cap/fill against a
# marketMetrics.json from a failed, possibly-incomplete run.
#
# One-time setup required (this workflow can't do these for you): none —
# reuses the same GIST_ID/GIST_TOKEN secrets already configured for
# generate-sector-metrics.yml. No Finnhub/Twelve Data/Alpha Vantage key
# needed (yfinance requires no key; applyDcfCap.js is pure local JSON
# manipulation).

name: Apply DCF cap

on:
  workflow_run:
    workflows: ['Generate sector metrics']
    types: [completed]
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Optional: process only this one ticker (debugging), ignoring the normal candidate list'
        required: false
        type: string

permissions:
  contents: read
  issues: write

# Shares a concurrency group with generate-sector-metrics.yml (same group
# name there) -- see that workflow's own comment for the full root-cause
# analysis (verified live 2026-09-17: this was the actual mechanism behind
# marketMetrics.json being frozen at a stale snapshot for about a month,
# and behind CCXI's data reverting three times earlier this session).
# `cancel-in-progress: false` queues rather than kills an in-progress run;
# every run here is functionally redundant with any later one (each just
# curls whatever's live and reapplies the same cap/fallback logic), so
# GitHub's own concurrency behavior -- collapsing multiple queued-but-not-
# started runs down to just the most recent -- causes no lost work here,
# unlike a TARGET_SYMBOL dispatch of the OTHER workflow in this group.
concurrency:
  group: gist-publish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Only run on a successful upstream completion -- never cap/fill against
    # a marketMetrics.json from a failed or cancelled generate-sector-metrics
    # run. Always runs for a manual workflow_dispatch (github.event.workflow_run
    # is unset there, so the workflow_run-specific check is skipped).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch candidates list from gist
        run: curl -sf "https://gist.githubusercontent.com/jadrayes1/5cd7f459788725521246717b9e164a8e/raw/dcfCapCandidates.json" -o dcfCapCandidates.json

      - name: Fetch analyst price targets for DCF cap/fallback candidates
        env:
          TARGET_SYMBOL: ${{ inputs.symbol }}
        run: python3 scripts/fetchDcfCapTargets.py

      # Fetching marketMetrics.json + applying the DCF cap + publishing are
      # combined into ONE step below (rather than three separate ones)
      # specifically so a rejected push can retry the WHOLE sequence
      # against a freshly-refetched base -- applyDcfCap.js does a WHOLESALE
      # overwrite of marketMetrics.json (see its own header: it's not a
      # targeted per-ticker merge the way generate-sector-metrics.yml's
      # TARGET_SYMBOL path is), so re-cloning the gist alone on retry isn't
      # enough -- src/data/marketMetrics.json itself has to be refetched and
      # re-capped too, or a retry would still overwrite a sibling writer's
      # change with the ORIGINAL (now-stale) local copy. applyDcfCap.js is
      # cheap and idempotent (just re-applies the SAME already-fetched
      # analystPriceTargets.json -- no need to re-run the slow yfinance step
      # above on retry), so redoing fetch+apply per attempt costs seconds,
      # not minutes.
      #
      # Root-caused live 2026-09-18: fetching marketMetrics.json before the
      # ~80-90 minute yfinance step above (the ORIGINAL structure of this
      # job) meant applyDcfCap.js always patched a base that was up to
      # 80-90 minutes stale by the time this workflow got around to
      # publishing, silently discarding anything published elsewhere in
      # that window -- the actual mechanism behind marketMetrics.json being
      # frozen at a month-old snapshot for weeks (see commit 107cc70's own
      # concurrency-group fix, which serializes runs but doesn't by itself
      # fix THIS staleness). Fetching AFTER the slow step instead costs
      # nothing extra (a single JSON download, seconds).
      #
      # `--force-with-lease` (instead of a bare `--force`) plus this retry
      # loop closes the remaining race precisely rather than just shrinking
      # its window: if the remote has moved since our clone (another gist
      # writer -- a sibling repo, a TARGET_SYMBOL backfill in the OTHER
      # concurrency group, etc. -- published in the interim), the push is
      # REJECTED instead of blindly overwriting; the whole fetch+apply+push
      # sequence then retries against a fresh clone, which naturally picks
      # up whatever just landed for every ticker THIS run didn't itself
      # re-cap. Bounded at 5 attempts so persistent contention fails loudly
      # (visible in this run's log, triggers the existing failure-issue
      # step below) instead of looping forever.
      #
      # Only marketMetrics.json changes here -- everything else in the gist
      # (trend caches, coverageAudit.json, dcfCapCandidates.json itself)
      # comes along unmodified from each attempt's fresh clone, since
      # nothing else is ever touched locally before the orphan commit.
      - name: Apply DCF cap and publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          CLONE_URL="https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git"
          mkdir -p src/data
          attempt=1
          while true; do
            curl -sf "https://gist.githubusercontent.com/jadrayes1/5cd7f459788725521246717b9e164a8e/raw/marketMetrics.json" -o src/data/marketMetrics.json
            node scripts/applyDcfCap.js
            rm -rf gist-clone
            git clone --depth 1 "$CLONE_URL" gist-clone
            if diff -q src/data/marketMetrics.json gist-clone/marketMetrics.json >/dev/null 2>&1; then
              echo "No changes to publish."
              break
            fi
            EXPECTED_SHA=$(git -C gist-clone rev-parse HEAD)
            cp src/data/marketMetrics.json gist-clone/marketMetrics.json
            ( cd gist-clone
              git config user.email "actions@github.com"
              git config user.name "stock-metrics-pipeline"
              git checkout --orphan latest-snapshot
              git add -A
              git commit -m "Apply DCF cap $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git branch -M main
              git push --force-with-lease="main:${EXPECTED_SHA}" origin main
            ) && { echo "Published on attempt $attempt."; break; }
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::Publish rejected 5 times in a row -- the gist kept changing underneath this run. Not forcing; re-dispatch once things settle."
              exit 1
            fi
            echo "Push rejected (remote moved since clone) — retrying with a fresh fetch (attempt ${attempt}/5)..."
          done

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'dcf-cap-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Apply-DCF-cap pipeline failed',
                body: `The DCF cap/fallback run failed.\n\nRun: ${runUrl}\n\nCheck the GIST_TOKEN/GIST_ID secrets, that generate-sector-metrics.yml published dcfCapCandidates.json today, and Yahoo Finance's status. Note: this is separate from the main sector-metrics pipeline — that one is unaffected.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'dcf-cap-pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Apply-DCF-cap pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
